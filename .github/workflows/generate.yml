name: Generate weekly reports

on:
  schedule:
   - cron: '0 3 * * *'  # Cada día a las 3 AM
  workflow_dispatch: {}   # Permite ejecutarlo manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: node generate.js
      - name: Commit changes
        run: |
          git config --global user.email "fotografiacamats@gmail.com"
          git config --global user.name "Adria"
          git add output/
          git commit -m "Generated weekly reports"
          git push
