name: Refresh 10 technical reports daily

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-technical-reports
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh the report batch
        run: node generate.js
      - name: Commit generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output/ .report-cursor .report-migration-complete
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Refresh daily technical report batch"
            git push
          fi
